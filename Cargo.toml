[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Cameron Tacklind <cameron@tacklind.com>"]
repository = "https://github.com/cinderblock/apitorrent"

[workspace.dependencies]
apitorrent-bencode = { path = "crates/apitorrent-bencode" }
apitorrent-metainfo = { path = "crates/apitorrent-metainfo" }
apitorrent-wire = { path = "crates/apitorrent-wire" }
apitorrent-engine = { path = "crates/apitorrent-engine" }
apitorrent-types = { path = "crates/apitorrent-types" }
apitorrent-core = { path = "crates/apitorrent-core" }
apitorrent-server = { path = "crates/apitorrent-server" }

# Core, server and daemon.
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
futures-util = "0.3"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = "0.30"
toml = "1"
tower-http = { version = "0.7", features = ["trace"] }
ts-rs = "12"

bytes = "1"
hex = "0.4"
percent-encoding = "2"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
data-encoding = "2"
proptest = "1"
rand = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
struct_field_names = "allow"
match_same_arms = "allow"
case_sensitive_file_extension_comparisons = "allow"
similar_names = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
