[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Cameron Tacklind <cameron@tacklind.com>"]
repository = "https://github.com/cinderblock/apitorrent"

[workspace.dependencies]
apitorrent-bencode = { path = "crates/apitorrent-bencode" }
apitorrent-metainfo = { path = "crates/apitorrent-metainfo" }
apitorrent-wire = { path = "crates/apitorrent-wire" }
apitorrent-engine = { path = "crates/apitorrent-engine" }
apitorrent-tracker = { path = "crates/apitorrent-tracker" }
apitorrent-dht = { path = "crates/apitorrent-dht" }
apitorrent-types = { path = "crates/apitorrent-types" }
apitorrent-core = { path = "crates/apitorrent-core" }
apitorrent-server = { path = "crates/apitorrent-server" }
apitorrent-deluge = { path = "crates/apitorrent-deluge" }
apitorrent-mse = { path = "crates/apitorrent-mse" }
apitorrent-utp = { path = "crates/apitorrent-utp" }
apitorrent-auth = { path = "crates/apitorrent-auth" }
apitorrent-webui = { path = "crates/apitorrent-webui" }
apitorrent-tls = { path = "crates/apitorrent-tls" }

# Core, server and daemon.
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
futures-util = "0.3"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = "0.30"
toml = "1"
tower-http = { version = "0.7", features = ["trace", "fs", "set-header"] }
ts-rs = "12"

bytes = "1"
hex = "0.4"
percent-encoding = "2"
sha1 = "0.10"
sha2 = "0.10"
socket2 = "0.6"
thiserror = "2"
reflink-copy = "0.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl"] }
data-encoding = "2"
proptest = "1"
rand = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
tracing = "0.1"
# Transport: MSE crypto. crypto-bigint gives a constant-time, fixed-width modpow.
crypto-bigint = { version = "0.7", default-features = false }
rc4 = "0.2"
num-bigint = "0.4"
# Transport: uTP. socket2 sizes the UDP buffers before tokio takes the socket.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
url = "2"
# TLS: rustls with the ring provider (no OpenSSL, no CMake), with certificates verified
# against the OS trust store by rustls-platform-verifier. Nothing may disable verification.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
struct_field_names = "allow"
match_same_arms = "allow"
case_sensitive_file_extension_comparisons = "allow"
similar_names = "allow"
assert_is_empty = "allow"

# Password hashing is deliberately expensive; unoptimised it takes seconds in debug builds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
