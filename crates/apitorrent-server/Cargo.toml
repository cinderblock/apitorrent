[package]
name = "apitorrent-server"
description = "The apitorrent HTTP and WebSocket API server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
apitorrent-auth.workspace = true
apitorrent-core.workspace = true
apitorrent-tls.workspace = true
apitorrent-plugin-api.workspace = true
apitorrent-types.workspace = true
apitorrent-webui.workspace = true
# http2: ALPN h2 on the built-in TLS listener.
axum = { workspace = true, features = ["http2"] }
futures-util.workspace = true
ipnet = "2"
# Gzip for large sync messages.
flate2 = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tower = { version = "0.5", features = ["util"] }
tower-http.workspace = true
tracing.workspace = true

[dev-dependencies]
data-encoding.workspace = true
getrandom = "0.3"
# The software authenticator in the tests; the same version webauthn-rs uses.
p256 = "0.14"
sha2.workspace = true
url.workspace = true
apitorrent-engine.workspace = true
apitorrent-metainfo.workspace = true
base64.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true
http-body-util = "0.1"
# The TLS tests: a test CA, a strict rustls client, and raw HTTP/1.1 and HTTP/2.
bytes.workspace = true
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rcgen.workspace = true
rustls.workspace = true
# The ACME test runs Pebble.
tokio = { workspace = true, features = ["process"] }

[lints]
workspace = true
