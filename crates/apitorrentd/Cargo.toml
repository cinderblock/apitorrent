[package]
name = "apitorrentd"
description = "The apitorrent daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
apitorrent-auth.workspace = true
apitorrent-core.workspace = true
apitorrent-dht.workspace = true
apitorrent-mse.workspace = true
apitorrent-engine.workspace = true
apitorrent-plugin-api.workspace = true
apitorrent-plugins.workspace = true
apitorrent-server.workspace = true
apitorrent-webui.workspace = true
apitorrent-tls.workspace = true
clap.workspace = true
directories.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
apitorrent-metainfo.workspace = true
apitorrent-types.workspace = true
axum.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[features]
# Compile the built web UI into the binary (release builds). Needs `bun run build` in web/
# first; see the README.
embedded-ui = ["apitorrent-webui/embed"]

[lints]
workspace = true
