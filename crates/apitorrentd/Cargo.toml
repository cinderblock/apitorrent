[package]
name = "apitorrentd"
description = "The apitorrent daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
apitorrent-auth.workspace = true
apitorrent-core.workspace = true
apitorrent-dht.workspace = true
apitorrent-mse.workspace = true
apitorrent-engine.workspace = true
apitorrent-plugin-api.workspace = true
apitorrent-plugins.workspace = true
apitorrent-server.workspace = true
apitorrent-webui.workspace = true
apitorrent-tls.workspace = true
apitorrent-types.workspace = true
apitorrent-update.workspace = true
clap.workspace = true
directories.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
url.workspace = true

[dev-dependencies]
apitorrent-metainfo.workspace = true
apitorrent-types.workspace = true
axum.workspace = true
rcgen.workspace = true
tempfile.workspace = true
# The DNS-01 test runs Pebble.
tokio = { workspace = true, features = ["process"] }

[features]
# Compile the built web UI into the binary (release builds). Needs `bun run build` in web/
# first; see the README.
embedded-ui = ["apitorrent-webui/embed"]
# Ship the first-party plugins (release builds): embeds every bundle in
# `dist/first-party-plugins` (or `APITORRENT_PLUGIN_DIST`), which `bun run
# build:first-party` at the repository root makes. The daemon offers them for approval.
first-party-plugins = []

[lints]
workspace = true
