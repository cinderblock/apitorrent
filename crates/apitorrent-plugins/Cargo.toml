[package]
name = "apitorrent-plugins"
description = "apitorrent's plugin host: TypeScript plugins on embedded V8, one isolate each, every privileged call checked against the plugin's grants"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
apitorrent-plugin-api.workspace = true
apitorrent-tls.workspace = true
apitorrent-tracker.workspace = true
apitorrent-types.workspace = true
# deno_core pins deno_error; this resolves to the same version.
deno_core = "0.413"
deno_error = "0.7"
encoding_rs = "0.8"
hex.workspace = true
hmac = "0.12"
rand.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
rcgen.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-rustls.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
