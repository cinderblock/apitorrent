# Weekly update PRs, grouped so each ecosystem is one PR to review. The workflow actions are
# pinned by commit; Dependabot moves the pin and the version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # The RustCrypto hashes share the `digest` traits, so a major release of one only builds
      # alongside the others. One PR for all of them, majors included. Listed first: a
      # dependency joins the first group that matches it.
      rustcrypto:
        patterns: [sha1, sha2, hmac, digest]
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        update-types: [minor, patch]
