# Weekly update PRs, grouped so each ecosystem is one PR to review. The workflow actions are
# pinned by commit; Dependabot moves the pin and the version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        update-types: [minor, patch]
